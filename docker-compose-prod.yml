# Secrets for Karton's own config come from .env as karton-core environment
# overrides (KARTON_<SECTION>_<OPTION>); ./karton.ini (copied from
# deploy/karton.ini.example) holds no secrets.
x-karton-secrets: &karton-secrets
  KARTON_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  KARTON_S3_ACCESS_KEY: ${SILO_ACCESS_KEY:?}
  KARTON_S3_SECRET_KEY: ${SILO_SECRET_KEY:?}

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped

  mwdb:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      karton-system-router:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: "wget -qO - 'http://127.0.0.1:8080/api/server' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    env_file:
      - mwdb-vars.env
    environment:
      <<: *karton-secrets
      GUNICORN_WORKERS: "2"
      # `environment` overrides `env_file`, so gen_vars.sh output stays untouched.
      MWDB_REDIS_URI: redis://:${REDIS_PASSWORD:?}@redis/
      MWDB_ENABLE_KARTON: "1"
      # In-tree plugins under docker/plugins/ get pip-installed into
      # site-packages, where MWDB's local_plugins_autodiscover scan of
      # /app/plugins/ won't find them. Name them explicitly here.
      MWDB_PLUGINS: yarax_regex,phpdeobf,malleus
      MWDB_PHPDEOBF_URL: http://phpdeobf:8080
      MWDB_MALLEUS_SET_GROUPS: ${MWDB_MALLEUS_SET_GROUPS:-karton}
      MWDB_MALLEUS_READ_GROUPS: ${MWDB_MALLEUS_READ_GROUPS:-jetpack-scan,wpcloud-scan,elderward}
      # MWDB_SANDBOX_URL must stay unset here: the synchronous PHP normalize
      # hook would add a normalized-php child per upload (see DEPLOYMENT.md).
    volumes:
      - mwdb-uploads:/app/uploads
      - ./karton.ini:/etc/karton/karton.ini:ro

  phpdeobf:
    build:
      context: ./docker/phpdeobf
      dockerfile: Dockerfile.server
    restart: unless-stopped

  mwdb-web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile-web
    depends_on:
      - mwdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mwdb.rule=Host(`${MWDB_DOMAIN:?}`)"
      - "traefik.http.routers.mwdb.entrypoints=websecure"
      - "traefik.http.routers.mwdb.tls.certresolver=letsencrypt"
      - "traefik.http.services.mwdb.loadbalancer.server.port=80"

  postgres:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mwdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    env_file:
      - postgres-vars.env
    volumes:
      - mwdb-postgres:/var/lib/postgresql/data
    shm_size: 256m

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    # Bound to the VPC address only, for the worker droplet's Karton service.
    ports:
      - "${VPC_BIND_IP:?}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Shared S3-compatible object store for Karton resources. Defined here rather
  # than included from compose/compose.silo.yml, which is a dev file (binds
  # 127.0.0.1, stores under /tmp, uses test keys).
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    entrypoint: sh
    command: -c "mkdir -p /data/mwdb /data/karton && silo server --address 0.0.0.0:9000 /data"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SILO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${SILO_SECRET_KEY:?}
    volumes:
      - karton-silo:/data
    ports:
      - "${VPC_BIND_IP:?}:9000:9000"
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3

  # Karton services (same images and commands as compose/compose.with-karton.yml).
  # karton-dashboard is deliberately absent: it has no authentication.
  karton-system-router:
    image: certpl/karton-system:v5.9.0
    restart: unless-stopped
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *karton-secrets
    volumes:
      - ./karton.ini:/etc/karton/karton.ini:ro
    entrypoint: karton-system
    command: --setup-bucket --disable-gc

  karton-system-gc:
    image: certpl/karton-system:v5.9.0
    restart: unless-stopped
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
      karton-system-router:
        condition: service_started
    environment:
      <<: *karton-secrets
    volumes:
      - ./karton.ini:/etc/karton/karton.ini:ro
    entrypoint: karton-system
    command: --disable-router

  karton-classifier:
    image: certpl/karton-classifier:v2.1.0
    restart: unless-stopped
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *karton-secrets
    volumes:
      - ./karton.ini:/etc/karton/karton.ini:ro

  karton-mwdb-reporter:
    image: certpl/karton-mwdb-reporter:v1.3.0
    restart: unless-stopped
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mwdb:
        condition: service_healthy
      mwdb-web:
        condition: service_healthy
    # API key of the dedicated `karton` MWDB user; no admin credentials and no
    # mwdb-vars.env here.
    environment:
      <<: *karton-secrets
      KARTON_MWDB_API_KEY: ${KARTON_MWDB_API_KEY:?}
    volumes:
      - ./karton.ini:/etc/karton/karton.ini:ro

volumes:
  mwdb-postgres:
  mwdb-uploads:
  letsencrypt:
  karton-silo:
