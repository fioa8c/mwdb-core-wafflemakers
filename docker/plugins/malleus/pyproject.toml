[project]
name = "malleus"
version = "0.1.0"
description = "Malleus second-opinion attributes and contracts plugin for MWDB"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["malleus"]
package-dir = {"malleus" = "."}
