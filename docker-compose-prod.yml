services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped

  mwdb:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    env_file:
      - mwdb-vars.env
    environment:
      - GUNICORN_WORKERS=2
      # In-tree plugins under docker/plugins/ get pip-installed into
      # site-packages, where MWDB's local_plugins_autodiscover scan of
      # /app/plugins/ won't find them. Name them explicitly here.
      - MWDB_PLUGINS=yarax_regex,phpdeobf,threatlib
      - MWDB_PHPDEOBF_URL=http://phpdeobf:8080
    volumes:
      - mwdb-uploads:/app/uploads
    networks:
      - default
      - phpdeobf-net

  phpdeobf:
    build:
      context: ./docker/phpdeobf
      dockerfile: Dockerfile.server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    networks:
      - phpdeobf-net
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 3s
      retries: 3

  threatlib-sync:
    build:
      context: .
      dockerfile: docker/threatlib-sync/Dockerfile
    depends_on:
      - mwdb
    restart: unless-stopped
    env_file:
      - mwdb-vars.env
    environment:
      - MWDB_PLUGINS=yarax_regex,phpdeobf,threatlib
      - MWDB_ENABLE_HOOKS=0
      - MWDB_THREATLIB_REPO_URL=git@github.a8c.com:Automattic/jetpack-threat-library.git
      - MWDB_THREATLIB_DEPLOY_KEY=/run/secrets/threatlib_deploy_key
      - MWDB_THREATLIB_KNOWN_HOSTS=/run/secrets/threatlib_known_hosts
      - MWDB_THREATLIB_SYNC_INTERVAL=900
      # Rollout step 1: keep at 0 until the first export diff has been reviewed.
      - MWDB_THREATLIB_PUSH=${MWDB_THREATLIB_PUSH:-0}
    volumes:
      - mwdb-uploads:/app/uploads
      - threatlib-repo:/data/repo
      - ./secrets/threatlib_deploy_key:/run/secrets/threatlib_deploy_key:ro
      - ./secrets/threatlib_known_hosts:/run/secrets/threatlib_known_hosts:ro

  mwdb-web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile-web
    depends_on:
      - mwdb
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mwdb.rule=Host(`${MWDB_DOMAIN}`)"
      - "traefik.http.routers.mwdb.entrypoints=websecure"
      - "traefik.http.routers.mwdb.tls.certresolver=letsencrypt"
      - "traefik.http.services.mwdb.loadbalancer.server.port=80"

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - postgres-vars.env
    volumes:
      - mwdb-postgres:/var/lib/postgresql/data
    shm_size: 256m

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  mwdb-postgres:
  mwdb-uploads:
  threatlib-repo:
  letsencrypt:

networks:
  phpdeobf-net:
    internal: true
