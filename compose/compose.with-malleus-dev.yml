# Publish Redis on localhost so malleus-static running on the laptop can reach the dev stack
# Needed only for running a local `malleus-static`; silo (S3) is already published by compose.silo.yml.
# Requires `--with dev --with karton` (it overrides `mailhog` from compose.with-dev.yml and
# `karton-mwdb-reporter` from compose.with-karton.yml); use
#   ./compose.sh --with dev --with plugins --with karton --with malleus-dev ...
# Also moves host ports that clash on this laptop (8081 = Kadath gateway, 8025-8026 = ddev mailhog) and gives the
# Karton reporter the generated admin credentials.
# Because the dev reporter logs in as the generated admin, the `malleus` plugin's reanalysis cleanup (which fires only
# for logins in MWDB_MALLEUS_REPORTER_LOGINS, default `karton`) does not run on this overlay, so
# `dev/malleus-smoke.py --reanalyze` needs a `karton` reporter account instead: create the user and group with the
# capabilities from section 9 of deploy/DEPLOYMENT.md and point the reporter's KARTON_MWDB_USERNAME /
# KARTON_MWDB_PASSWORD at it.
# The web UI is then at http://127.0.0.1:8082 and the smoke script needs MWDB_URL=http://127.0.0.1:8082/api.
services:
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  mwdb-web:
    # The dev overlay publishes the SPA on port 80, which is often taken on a laptop; use 8082 instead.
    ports: !override
      - "127.0.0.1:8082:3000"
  mailhog:
    ports: !override
      - "127.0.0.1:8027:8025"
  karton-mwdb-reporter:
    # dev/karton.ini (upstream) hard-codes [mwdb] username = admin / password = admin, but gen_vars.sh generates a
    # random admin password into mwdb-vars.env (passed in by compose.with-karton.yml as MWDB_ADMIN_LOGIN /
    # MWDB_ADMIN_PASSWORD). karton-core lets KARTON_MWDB_USERNAME / KARTON_MWDB_PASSWORD override karton.ini, so derive
    # them at start. Same shell entrypoint as the image (/bin/sh -c karton-mwdb-reporter). Prod uses KARTON_MWDB_API_KEY.
    entrypoint:
      - sh
      - -c
      - 'export KARTON_MWDB_USERNAME="$$MWDB_ADMIN_LOGIN" KARTON_MWDB_PASSWORD="$$MWDB_ADMIN_PASSWORD"; exec karton-mwdb-reporter'
